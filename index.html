<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Contact</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-6 space-y-6 text-center">
    <div>
      <h1 class="text-2xl font-bold text-gray-800">Nice to meet you!</h1>
      <p class="text-gray-500 mt-2">Share your contact info seamlessly.</p>
    </div>

    <!-- Native vCard Upload -->
    <div id="upload-section" class="border-2 border-dashed border-blue-200 rounded-xl p-6 bg-blue-50 transition-all">
      <input type="file" id="vcard-upload" accept=".vcf" class="hidden" />
      <button onclick="document.getElementById('vcard-upload').click()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition shadow-md">
        Upload Contact Card (.vcf)
      </button>
      <p class="text-xs text-gray-500 mt-3">iPhone: Contacts App > Share Contact > Save to Files</p>
    </div>

    <div id="divider" class="flex items-center space-x-2">
      <hr class="flex-grow border-gray-200">
      <span class="text-gray-400 text-sm">OR TYPE IT</span>
      <hr class="flex-grow border-gray-200">
    </div>

    <!-- Manual Fallback Form -->
    <form id="contact-form" class="space-y-4 text-left">
      <input type="text" id="manual-name" placeholder="Full Name (Required)" required class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none">
      <input type="email" id="manual-email" placeholder="Email Address" class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none">
      <input type="tel" id="manual-phone" placeholder="Phone Number" class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none">
      <button type="button" id="manual-next-btn" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-4 rounded-lg transition shadow-md">
        Next Step
      </button>
    </form>

    <!-- vCard Preview -->
    <div id="vcard-preview" class="hidden border border-gray-200 rounded-xl p-5 bg-white space-y-3 text-left shadow-sm">
      <h3 class="font-bold text-gray-800 text-sm uppercase tracking-wide">1. Select info to share</h3>
      <div id="parsed-fields" class="space-y-2"></div>
    </div>

    <!-- Dynamic Custom Fields -->
    <div id="dynamic-fields-container" class="hidden space-y-4 mt-4 text-left border border-gray-200 p-5 rounded-xl bg-gray-50 shadow-sm">
      <h3 class="font-bold text-gray-800 text-sm uppercase tracking-wide">2. Additional Info</h3>
      <div id="dynamic-fields" class="space-y-4"></div>
    </div>

    <!-- Final Submit Button -->
    <button id="final-submit-btn" class="hidden w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-4 rounded-lg transition shadow-md mt-6 text-lg">
      Confirm & Share Contact
    </button>
    
    <div id="success-message" class="hidden bg-green-50 border border-green-200 text-green-700 font-bold p-6 rounded-xl mt-4">
      <span class="text-3xl block mb-2">✅</span>
      Contact shared successfully!<br><span class="font-normal text-sm">You can now close this tab.</span>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    // 🔴 UPDATE THESE WITH YOUR SUPABASE CREDENTIALS 🔴
    const supabaseUrl = 'https://tyqundkujjkqirbosxfv.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5cXVuZGt1amprcWlyYm9zeGZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNDg1NTYsImV4cCI6MjEwMjkyNDU1Nn0.Eh7LTwMIgayAVKLsGvwgxcmj9UJOB6yj7WT9rhrtcoU';
    const supabase = createClient(supabaseUrl, supabaseKey);

    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('sid');
    const tag = urlParams.get('tag') || 'Untagged';

    if (!sessionId) {
      alert("Invalid session. Please ask to rescan the QR code.");
    }

    let parsedContactData = {}; 
    let isVCard = false;

    function loadCustomFields() {
      const container = document.getElementById('dynamic-fields');
      let html = '';

      if (tag === 'Student') {
        html = `
          <input type="text" id="dyn-school" placeholder="Current High School / College *" required class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none">
          <select id="dyn-grad-year" required class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none bg-white">
            <option value="" disabled selected>Expected Grad/Transfer Year *</option>
            <option value="2026">2026</option><option value="2027">2027</option>
            <option value="2028">2028</option><option value="2029">2029</option>
            <option value="2030+">2030+</option>
          </select>
          <input type="text" id="dyn-major" placeholder="Intended Major / Interest (Optional)" class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none">
          <input type="text" id="dyn-extra" placeholder="Extracurricular Interests (Optional)" class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none">
        `;
      } else if (tag === 'Employee Prospect') {
        html = `
          <input type="text" id="dyn-role" placeholder="Desired Role or Department *" required class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none">
          <select id="dyn-exp" required class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none bg-white">
            <option value="" disabled selected>Years of Experience *</option>
            <option value="Entry-Level (0-1 yrs)">Entry-Level (0-1 yrs)</option>
            <option value="Mid-Level (2-5 yrs)">Mid-Level (2-5 yrs)</option>
            <option value="Senior (5+ yrs)">Senior (5+ yrs)</option>
          </select>
          <input type="text" id="dyn-edu" placeholder="Certifications or Highest Ed. (Optional)" class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none">
          <select id="dyn-start" class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none bg-white">
            <option value="" disabled selected>Available to Start (Optional)</option>
            <option value="Immediately">Immediately</option>
            <option value="2 Weeks Notice">2 Weeks Notice</option>
            <option value="Next Month/Semester">Next Month/Semester</option>
          </select>
          <input type="url" id="dyn-linkedin" placeholder="LinkedIn or Portfolio URL (Optional)" class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none">
        `;
      } else if (tag === 'Business Contact') {
        html = `
          <input type="text" id="dyn-company" placeholder="Company Name *" required class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none">
          <input type="text" id="dyn-title" placeholder="Job Title *" required class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none">
          <select id="dyn-interest" class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none bg-white">
            <option value="" disabled selected>Primary Interest (Optional)</option>
            <option value="Buying/Services">Buying/Services</option>
            <option value="Partnership">Partnership</option>
            <option value="Just Networking">Just Networking</option>
          </select>
          <input type="url" id="dyn-linkedin-biz" placeholder="LinkedIn URL (Optional)" class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none">
        `;
      } else if (tag === 'Friend') {
        html = `
          <input type="text" id="dyn-social" placeholder="Instagram / Social Handle (Optional)" class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none">
          <input type="text" id="dyn-context" placeholder="Where did we meet? (Optional)" class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none">
          <input type="text" id="dyn-bday" placeholder="Birthday e.g. Oct 12 (Optional)" class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none">
        `;
      }

      if (html) {
        container.innerHTML = html;
        document.getElementById('dynamic-fields-container').classList.remove('hidden');
      }
    }

    document.getElementById('vcard-upload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        isVCard = true;
        const vcardContent = event.target.result;
        
        const nameMatch = vcardContent.match(/FN:(.*)/i);
        const emailMatch = vcardContent.match(/EMAIL.*:(.*)/i);
        const phoneMatch = vcardContent.match(/TEL.*:(.*)/i);

        parsedContactData = {
          name: nameMatch ? nameMatch[1].trim() : "Unknown Name",
          email: emailMatch ? emailMatch[1].trim() : "",
          phone: phoneMatch ? phoneMatch[1].trim() : "",
        };

        const fieldsContainer = document.getElementById('parsed-fields');
        fieldsContainer.innerHTML = '';
        
        const addCheckbox = (label, value, key) => {
          if (!value) return;
          fieldsContainer.innerHTML += `
            <label class="flex items-center space-x-3 bg-gray-50 p-3 rounded-lg border cursor-pointer hover:bg-gray-100 transition">
              <input type="checkbox" checked data-key="${key}" class="vcard-checkbox w-5 h-5 text-blue-600 rounded">
              <span class="text-gray-700 font-medium">${label}: <span class="font-normal text-gray-500 truncate max-w-[200px] inline-block align-bottom">${value}</span></span>
            </label>
          `;
        };

        addCheckbox("Name", parsedContactData.name, "name");
        addCheckbox("Email", parsedContactData.email, "email");
        addCheckbox("Phone", parsedContactData.phone, "phone");

        document.getElementById('upload-section').classList.add('hidden');
        document.getElementById('contact-form').classList.add('hidden');
        document.getElementById('divider').classList.add('hidden');
        document.getElementById('vcard-preview').classList.remove('hidden');
        loadCustomFields();
        document.getElementById('final-submit-btn').classList.remove('hidden');
      };
      reader.readAsText(file);
    });

    document.getElementById('manual-next-btn').addEventListener('click', () => {
      const name = document.getElementById('manual-name').value;
      if (!name) return alert("Name is required!");

      isVCard = false;
      parsedContactData = {
        name: name,
        email: document.getElementById('manual-email').value,
        phone: document.getElementById('manual-phone').value,
      };

      document.getElementById('upload-section').classList.add('hidden');
      document.getElementById('contact-form').classList.add('hidden');
      document.getElementById('divider').classList.add('hidden');
      loadCustomFields();
      document.getElementById('final-submit-btn').classList.remove('hidden');
    });

    document.getElementById('final-submit-btn').addEventListener('click', async () => {
      const btn = document.getElementById('final-submit-btn');
      btn.innerText = "Saving to Database...";
      btn.disabled = true;

      const finalPayload = {};

      if (isVCard) {
        document.querySelectorAll('.vcard-checkbox').forEach(cb => {
          if (cb.checked) {
            const key = cb.getAttribute('data-key');
            finalPayload[key] = parsedContactData[key];
          }
        });
      } else {
        Object.assign(finalPayload, parsedContactData);
      }

      const safeVal = (id) => document.getElementById(id) ? document.getElementById(id).value : null;
      
      if (tag === 'Student') {
        finalPayload.school = safeVal('dyn-school');
        finalPayload.grad_year = safeVal('dyn-grad-year');
        finalPayload.major = safeVal('dyn-major');
        finalPayload.extracurriculars = safeVal('dyn-extra');
      } else if (tag === 'Employee Prospect') {
        finalPayload.desired_role = safeVal('dyn-role');
        finalPayload.experience = safeVal('dyn-exp');
        finalPayload.education = safeVal('dyn-edu');
        finalPayload.availability = safeVal('dyn-start');
        finalPayload.linkedin = safeVal('dyn-linkedin');
      } else if (tag === 'Business Contact') {
        finalPayload.company = safeVal('dyn-company');
        finalPayload.title = safeVal('dyn-title');
        finalPayload.interest = safeVal('dyn-interest');
        finalPayload.linkedin = safeVal('dyn-linkedin-biz');
      } else if (tag === 'Friend') {
        finalPayload.social_handle = safeVal('dyn-social');
        finalPayload.context = safeVal('dyn-context');
        finalPayload.birthday = safeVal('dyn-bday');
      }

      let missingReq = false;
      document.querySelectorAll('#dynamic-fields [required]').forEach(el => {
        if (!el.value) missingReq = true;
      });
      if (missingReq) {
        alert("Please fill out all required additional info fields.");
        btn.innerText = "Confirm & Share Contact";
        btn.disabled = false;
        return;
      }

      try {
        const { error } = await supabase
          .from('contacts')
          .insert([{ ...finalPayload, session_id: sessionId, tag: tag }]);

        if (error) throw error;
        
        document.getElementById('vcard-preview').classList.add('hidden');
        document.getElementById('dynamic-fields-container').classList.add('hidden');
        btn.classList.add('hidden');
        document.getElementById('success-message').classList.remove('hidden');
      } catch (error) {
        alert("Error saving contact: " + error.message);
        btn.innerText = "Confirm & Share Contact";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
